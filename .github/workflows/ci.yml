name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Create venv
        run: uv venv --python 3.12
      - name: Install (core + workspace extra)
        run: uv pip install -e ".[dev,workspace]"
      - name: Test
        run: uv run pytest tests/ -q
